name: Refresh APRA MySuper data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download configured APRA source
        run: |
          SOURCE_URL=$(python -c "import json; print(json.load(open('config/source.json'))['download_url'])")
          curl --fail --location --retry 3 --output /tmp/MySuper_CPPP.csv "$SOURCE_URL"

      - name: Validate and generate browser data
        run: python ingestion/transform.py --input /tmp/MySuper_CPPP.csv

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Publish validation summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('public/data/validation.json'))
          print('# APRA ingestion validation')
          print(f"- Status: **{report['status'].upper()}**")
          print(f"- Source rows: {report['sourceRowCount']}")
          print(f"- Accepted records: {report['acceptedRecordCount']}")
          print(f"- Scorable records: {report['scorableRecordCount']}")
          print(f"- Rejected records: {report['rejectedRecordCount']}")
          print(f"- Excluded lifecycle aggregate rows: {report['excludedAggregateRowCount']}")
          print(f"- Duplicate identifiers: {len(report['duplicateProductIds'])}")
          PY

      - name: Open reviewed data-refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "data: refresh APRA MySuper dataset"
          title: "Data refresh: APRA MySuper CPPP"
          body: |
            Automated APRA refresh. Review `public/data/validation.json`, source metadata and changed product records before merging.
          branch: data/apra-mysuper-refresh
          delete-branch: true
