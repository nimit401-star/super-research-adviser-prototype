name: Audit diversified Choice cohort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download APRA QSPS quantitative tables
        run: |
          curl --fail --location --retry 3 --output /tmp/qsps-quantitative.zip "https://www.apra.gov.au/system/files/2026-06/QSPS%20March%202026%20CSV%20files%20-%20Table%204-11.zip"
          mkdir -p /tmp/qsps-quantitative
          unzip -q /tmp/qsps-quantitative.zip -d /tmp/qsps-quantitative
      - name: Audit diversified Choice cohort
        run: python ingestion/audit_choice_cohort.py --input-dir /tmp/qsps-quantitative
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish cohort summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("public/data/choice-cohort-audit.json", encoding="utf-8"))
          print("# Diversified Choice fee-alignment audit")
          print(f"- Reporting date: **{report['reportingDate']}**")
          print(f"- Current Table 5a rows reviewed: **{report['currentPerformanceRowCount']:,}**")
          print(f"- Fee-aligned peer records: **{report['eligibleRecordCount']:,}**")
          print(f"- Representative-fee mismatches: **{report['representativeFeeMismatchCount']:,}**")
          print(f"- Source-reported zero-fee pathways: **{report['sourceReportedZeroFeeCount']:,}**")
          print(f"- Shared option IDs across product/menu pathways: **{report['sharedOptionIdCount']:,}**")
          print("- Peer groups:")
          for name, count in report["peerGroupCounts"].items():
              print(f"  - {name}: **{count:,}**")
          print("- Fee formula: **fixed annual dollars + selected balance × variable annual rate**")
          print("- Choice ranking enabled: **No**")
          print("- Balance-aligned fees are validated; review the generated cohort before adviser-facing ranking integration.")
          PY
      - name: Upload Choice cohort audit
        uses: actions/upload-artifact@v4
        with:
          name: apra-diversified-choice-fee-audit
          path: public/data/choice-cohort-audit.json
          if-no-files-found: error
          retention-days: 14
